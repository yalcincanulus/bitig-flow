# Coolify production stack. Do not use compose.yaml — that file is local infra
# and publishes ports plus Mailpit. In Coolify set Docker Compose Location to
# /compose.coolify.yaml.
#
# Caddy on Coolify reaches containers on the Compose network. Do not add ports:.
# In the Coolify domain field, give the app https://your.domain:3000 and Garage
# https://s3.your.domain:3900. The :port suffix is the container port, not a
# public host port.
#
# Public URLs come from SERVICE_URL_APP and SERVICE_URL_GARAGE. Coolify rewrites
# those when the domain changes. The port-suffixed copies stay on the first
# generated host. The ": /" assignments only tell Coolify which container port
# to route.
#
# Coolify generates a secret only when the name has two or three underscores.
# SERVICE_HEX_64_RPC works. SERVICE_HEX_64_GARAGE_RPC does not, and stays empty.
#
# Mailpit is not here. Leave SMTP_* unset so mail stays unavailable, which is
# the demo posture.
#
# After the first deploy, bootstrap the Platform Operator from the app
# container, then wait until Reaper and Sweep have run once before opening
# demos (see docs/demo-rollout-readiness.md).

x-app-environment: &app-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: "3000"
  TRUSTED_PROXY_COUNT: "1"
  POSTGRES_USER: ${SERVICE_USER_POSTGRES}
  POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
  POSTGRES_DB: bitig_db
  DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/bitig_db
  REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
  REDIS_URL: redis://:${SERVICE_PASSWORD_REDIS}@redis:6379
  S3_ENDPOINT: http://garage:3900
  S3_PUBLIC_ENDPOINT: ${SERVICE_URL_GARAGE}
  S3_REGION: garage
  S3_BUCKET: bitig
  S3_ACCESS_KEY_ID: GK${SERVICE_HEX_32_S3ACCESS}
  S3_SECRET_ACCESS_KEY: ${SERVICE_HEX_64_S3SECRET}
  GARAGE_RPC_SECRET: ${SERVICE_HEX_64_RPC}
  GARAGE_ADMIN_TOKEN: ${SERVICE_REALBASE64_32_ADMIN}
  BETTER_AUTH_SECRET: ${SERVICE_REALBASE64_32_AUTH}
  BETTER_AUTH_URL: ${SERVICE_URL_APP}
  ANALYTICS_SALT: ${SERVICE_HEX_64_ANALYTICS}
  GATE_RATELIMIT_SALT: ${SERVICE_HEX_64_GATE}

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

services:
  postgres:
    image: postgres:19beta3-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      POSTGRES_DB: bitig_db
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.8.1-alpine3.23
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${SERVICE_PASSWORD_REDIS}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20

  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      SERVICE_URL_GARAGE_3900: /
      GARAGE_RPC_SECRET: ${SERVICE_HEX_64_RPC}
      GARAGE_ADMIN_TOKEN: ${SERVICE_REALBASE64_32_ADMIN}
      GARAGE_DEFAULT_BUCKET: bitig
      GARAGE_DEFAULT_ACCESS_KEY: GK${SERVICE_HEX_32_S3ACCESS}
      GARAGE_DEFAULT_SECRET_KEY: ${SERVICE_HEX_64_S3SECRET}
    volumes:
      - type: bind
        source: ./infra/garage/garage.toml
        target: /etc/garage.toml
        content: |
          metadata_dir = "/var/lib/garage/meta"
          data_dir = "/var/lib/garage/data"
          db_engine = "sqlite"
          replication_factor = 1
          rpc_bind_addr = "[::]:3901"
          rpc_public_addr = "127.0.0.1:3901"
          [s3_api]
          s3_region = "garage"
          api_bind_addr = "[::]:3900"
          [admin]
          api_bind_addr = "[::]:3903"
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
    expose:
      - "3900"

  garage-init:
    # One-shot Alpine job. Storage is Garage; this calls its admin API.
    image: alpine:3.23
    restart: "no"
    exclude_from_hc: true
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_ADMIN_TOKEN: ${SERVICE_REALBASE64_32_ADMIN}
      S3_BUCKET: bitig
      CORS_ORIGINS: ${SERVICE_URL_APP}
    volumes:
      - ./infra/docker/garage-cors.sh:/garage-cors.sh:ro
    entrypoint: ["/bin/sh", "/garage-cors.sh"]

  app:
    build: *app-build
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    environment:
      <<: *app-environment
      SERVICE_URL_APP_3000: /
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # Demo readiness requires a fresh Reaper (30 minutes) and Sweep (48 hours).
  # These sidecars are the Compose equivalent of the Coolify scheduled tasks
  # named in ADR-0021 and docs/demo-rollout-readiness.md.
  reaper:
    build: *app-build
    restart: unless-stopped
    exclude_from_hc: true
    environment: *app-environment
    command: ["node", "--import", "tsx", "src/server/reaper-cli.ts", "--watch"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy

  sweep:
    build: *app-build
    restart: unless-stopped
    exclude_from_hc: true
    environment: *app-environment
    command:
      [
        "sh",
        "-c",
        "while true; do node --import tsx src/server/sweep-cli.ts || true; sleep 86400; done",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy

  summary-fold:
    build: *app-build
    restart: unless-stopped
    exclude_from_hc: true
    environment: *app-environment
    command:
      [
        "sh",
        "-c",
        "while true; do node --import tsx src/server/summary-fold-cli.ts || true; sleep 86400; done",
      ]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  garage-meta:
  garage-data:
