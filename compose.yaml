name: bitig-flow

# Local development infrastructure. Everything the app talks to, one command:
#
#   docker compose up -d --wait
#
# Values come from .env (see .env.example). Nothing here is production shaped —
# single-node Garage has no redundancy, and Mailpit swallows every outbound mail.

services:
  postgres:
    image: postgres:19beta3-bookworm
    container_name: bitig-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      # PGDATA is /var/lib/postgresql/19/docker in this image; mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.8.1-alpine3.23
    container_name: bitig-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: bitig-garage
    restart: unless-stopped
    # `--single-node` stages and applies the cluster layout itself (idempotent on
    # restart), and `--default-bucket` creates the bucket + imports the access key
    # below with read/write/owner. Without the command override the image runs
    # `garage server` with no layout and the S3 API serves nothing.
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
    ports:
      - "3900:3900" # S3 API
      - "3903:3903" # admin API
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      # The image has no shell, so this must be exec form.
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  garage-init:
    # One-shot: bucket CORS is plain S3 (PutBucketCors), not a `garage` CLI command,
    # so `--default-bucket` does not cover it. Re-running replaces the config.
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      garage:
        condition: service_healthy
    environment:
      MC_HOST_garage: http://${S3_ACCESS_KEY_ID}:${S3_SECRET_ACCESS_KEY}@garage:3900
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./infra/garage/cors.xml:/cors.xml:ro
    entrypoint: ["/bin/sh", "-c", "mc cors set garage/$${S3_BUCKET} /cors.xml"]
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.30.7
    container_name: bitig-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI — http://localhost:8025
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  garage-meta:
  garage-data:
